[workspace]
members = ["crates/reconx-core","crates/reconx-common","crates/reconx-breach","crates/reconx-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["ReconX Team"]

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
clap = { version = "4.4", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
colored = "2.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
md5 = "0.7"
regex = "1.10"
dotenv = "0.15"
url = "2.5"
futures = "0.3"
dirs = "5.0"
async-trait = "0.1"
sha2 = "0.10"
hex = "0.4"
