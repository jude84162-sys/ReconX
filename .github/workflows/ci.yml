name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # pytest lives in the [project.optional-dependencies].dev extra.
          pip install pytest

      - name: Run test suite
        run: pytest -q

  lint:
    # ADVISORY, NOT BLOCKING.
    #
    # The Python code predates black/isort/flake8 adoption, so a first blocking
    # run would fail on cosmetic issues and teach everyone to ignore CI. Each
    # step below reports its findings but does not fail the job.
    #
    # To promote this to a real gate: run `black .` and `isort .` once, clear
    # the flake8 output, then delete the `continue-on-error` lines and add this
    # job to the required checks in branch protection.
    name: lint & security scan (advisory)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black isort flake8 bandit

      - name: black --check
        continue-on-error: true
        run: black --check --diff .

      - name: isort --check
        continue-on-error: true
        run: isort --check-only --diff .

      - name: flake8
        continue-on-error: true
        run: flake8 reconx tests

      - name: bandit (reads [tool.bandit] from pyproject.toml)
        continue-on-error: true
        run: bandit -r reconx -c pyproject.toml
