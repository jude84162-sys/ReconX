<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReconX — Recon &amp; Vuln Suite</title>
<style>
  :root{
    --bg:#0b0f14; --bg2:#111823; --bg3:#17212e; --line:#1f2c3a;
    --txt:#cfe3f2; --dim:#7c93a8; --accent:#2de2a6; --accent2:#39b1ff;
    --cyan:#49d3ff; --mag:#c678dd; --red:#ff5c71; --amber:#ffb454;
    --green:#49e39b; --hi:#1b2a3a;
    --info:#49d3ff; --low:#8fb9d9; --medium:#ffb454; --high:#ff8a5c; --critical:#ff4d67;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:14px;
    display:flex;flex-direction:column;overflow:hidden}
  a{color:var(--cyan)}
  /* header */
  header{display:flex;align-items:center;gap:16px;padding:10px 16px;background:var(--bg2);
    border-bottom:1px solid var(--line);flex:0 0 auto}
  .logo{font-family:var(--mono);font-weight:700;letter-spacing:.5px;font-size:16px;color:var(--accent)}
  .logo b{color:var(--txt)}
  .badge{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:999px;
    border:1px solid var(--line);color:var(--dim);white-space:nowrap}
  .badge.ok{color:var(--green);border-color:#1d4} .badge.warn{color:var(--amber)}
  header .spacer{flex:1}
  .auth{display:flex;align-items:center;gap:10px}
  .auth input[type=text]{background:var(--bg);border:1px solid var(--line);color:var(--txt);
    border-radius:7px;padding:7px 9px;font-size:12px;width:230px;font-family:var(--mono)}
  .switch{position:relative;display:inline-block;width:46px;height:24px}
  .switch input{display:none}
  .slider{position:absolute;inset:0;background:#2a3a4a;border-radius:999px;cursor:pointer;transition:.2s}
  .slider:before{content:"";position:absolute;height:18px;width:18px;left:3px;top:3px;
    background:#dfe;border-radius:50%;transition:.2s}
  .switch input:checked + .slider{background:var(--red)}
  .switch input:checked + .slider:before{transform:translateX(22px)}
  /* layout */
  .wrap{flex:1;display:flex;min-height:0}
  aside{width:300px;flex:0 0 300px;background:var(--bg2);border-right:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0}
  .search{padding:10px}
  .search input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--txt);
    border-radius:8px;padding:9px 11px;font-size:13px}
  .toollist{overflow:auto;flex:1;padding:0 6px 16px}
  .cat{font-family:var(--mono);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;
    color:var(--dim);padding:12px 10px 5px}
  .tool{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer;
    border:1px solid transparent}
  .tool:hover{background:var(--bg3)}
  .tool.active{background:var(--hi);border-color:#24415a}
  .tool .ic{font-size:15px;width:20px;text-align:center}
  .tool .nm{flex:1;font-size:13px}
  .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
  .dot.info{background:var(--info)} .dot.active{background:var(--amber)} .dot.intrusive{background:var(--red)}
  .av{font-family:var(--mono);font-size:9px;padding:1px 5px;border-radius:5px;border:1px solid var(--line);color:var(--dim)}
  .av.module{color:var(--green);border-color:#1d4} .av.builtin{color:var(--cyan)} .av.none{color:#55697b}
  /* main */
  main{flex:1;display:flex;flex-direction:column;min-width:0}
  .panel{padding:16px 20px;overflow:auto}
  .toolhead{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px}
  .toolhead .big{font-size:22px}
  .toolhead h1{font-size:18px;margin:0}
  .toolhead p{margin:3px 0 0;color:var(--dim);font-size:13px}
  .tags{display:flex;gap:7px;margin:10px 0 14px;flex-wrap:wrap}
  .tag{font-family:var(--mono);font-size:10.5px;padding:3px 8px;border-radius:6px;border:1px solid var(--line)}
  .tag.info{color:var(--info)} .tag.active{color:var(--amber);border-color:#5a4420}
  .tag.intrusive{color:var(--red);border-color:#5a2230}
  form.fields{display:grid;gap:12px;max-width:760px}
  .field label{display:block;font-size:12px;color:var(--dim);margin-bottom:5px;font-family:var(--mono)}
  .field input[type=text],.field input[type=number],.field select,.field textarea{
    width:100%;background:var(--bg);border:1px solid var(--line);color:var(--txt);
    border-radius:8px;padding:10px 12px;font-size:13px;font-family:var(--mono)}
  .field textarea{min-height:76px;resize:vertical}
  .field.check{display:flex;align-items:center;gap:9px}
  .field.check input{width:16px;height:16px}
  .actions{display:flex;gap:10px;align-items:center;margin-top:4px}
  button.run{background:var(--accent);color:#04231a;border:0;border-radius:9px;padding:11px 22px;
    font-weight:700;cursor:pointer;font-size:14px}
  button.run:hover{filter:brightness(1.08)} button.run:disabled{opacity:.5;cursor:not-allowed}
  button.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);border-radius:9px;
    padding:10px 16px;cursor:pointer}
  button.ghost:hover{color:var(--txt);border-color:#39546e}
  .hint{color:var(--amber);font-size:12px;margin-top:8px;display:none}
  /* output */
  .out{flex:1;display:flex;flex-direction:column;border-top:1px solid var(--line);min-height:0}
  .tabs{display:flex;gap:2px;background:var(--bg2);padding:6px 12px 0;align-items:center}
  .tab{padding:8px 15px;font-size:12.5px;color:var(--dim);cursor:pointer;border-radius:8px 8px 0 0}
  .tab.active{color:var(--txt);background:var(--bg)}
  .tab .n{font-family:var(--mono);font-size:10px;background:var(--bg3);padding:1px 6px;border-radius:999px;margin-left:6px}
  .tabs .spacer{flex:1}
  .statuschip{font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
  .statuschip.running{color:var(--amber);border-color:#5a4420}
  .statuschip.done{color:var(--green);border-color:#1d4}
  .statuschip.error{color:var(--red);border-color:#5a2230}
  .tabbody{flex:1;overflow:auto;background:var(--bg)}
  pre.console{margin:0;padding:14px 16px;font-family:var(--mono);font-size:12.5px;line-height:1.55;
    white-space:pre-wrap;word-break:break-word;color:#b9d2e6}
  pre.console .p{color:var(--accent)}
  .findings{padding:14px 16px;display:grid;gap:10px}
  .finding{border:1px solid var(--line);border-left-width:4px;border-radius:9px;padding:11px 13px;background:var(--bg2)}
  .finding.critical{border-left-color:var(--critical)} .finding.high{border-left-color:var(--high)}
  .finding.medium{border-left-color:var(--medium)} .finding.low{border-left-color:var(--low)}
  .finding.info{border-left-color:var(--info)}
  .finding .ft{display:flex;align-items:center;gap:9px}
  .finding .sev{font-family:var(--mono);font-size:10px;text-transform:uppercase;padding:2px 7px;border-radius:5px}
  .sev.critical{background:#3a0e18;color:var(--critical)} .sev.high{background:#3a1c10;color:var(--high)}
  .sev.medium{background:#352a10;color:var(--medium)} .sev.low{background:#132433;color:var(--low)}
  .sev.info{background:#102633;color:var(--info)}
  .finding .nm{font-weight:600}
  .finding .dt{color:var(--dim);font-size:12.5px;margin-top:5px}
  .finding .ev{font-family:var(--mono);font-size:11.5px;color:var(--amber);margin-top:6px;
    background:var(--bg);padding:6px 9px;border-radius:6px;overflow:auto}
  pre.json{margin:0;padding:14px 16px;font-family:var(--mono);font-size:12px;color:#9fc6a8;white-space:pre-wrap;word-break:break-word}
  .empty{color:var(--dim);padding:26px 16px;text-align:center;font-size:13px}
  /* jobs drawer */
  .jobs{border-top:1px solid var(--line);background:var(--bg2);max-height:150px;display:flex;flex-direction:column}
  .jobs h3{margin:0;padding:8px 14px;font-size:11px;color:var(--dim);font-family:var(--mono);letter-spacing:1px;
    display:flex;align-items:center;gap:8px;cursor:pointer}
  .joblist{overflow:auto;padding:0 8px 8px}
  .jobrow{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:12.5px}
  .jobrow:hover{background:var(--bg3)}
  .jobrow .ji{font-family:var(--mono);color:var(--dim);font-size:11px}
  .jobrow .js{margin-left:auto;font-family:var(--mono);font-size:10px}
  .muted{color:var(--dim)} .mono{font-family:var(--mono)}
  ::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#223141;border-radius:6px}
</style>
</head>
<body>
<header>
  <div class="logo">Recon<b>X</b><span style="color:var(--dim);font-weight:400">·gui</span></div>
  <span id="backend" class="badge">backend: …</span>
  <div class="spacer"></div>
  <div class="auth">
    <input id="scope" type="text" placeholder="in-scope note (e.g. H1: *.target.com)">
    <span class="mono" style="font-size:12px;color:var(--dim)">Authorized</span>
    <label class="switch"><input id="authToggle" type="checkbox"><span class="slider"></span></label>
  </div>
</header>

<div class="wrap">
  <aside>
    <div class="search"><input id="filter" type="text" placeholder="🔎 filter 38 tools…"></div>
    <div id="toollist" class="toollist"></div>
  </aside>

  <main>
    <div class="panel" id="formPanel">
      <div class="empty">Select a tool from the left to begin.</div>
    </div>

    <div class="out">
      <div class="tabs">
        <div class="tab active" data-tab="console">Console</div>
        <div class="tab" data-tab="findings">Findings <span class="n" id="fcount">0</span></div>
        <div class="tab" data-tab="json">Raw JSON</div>
        <div class="spacer"></div>
        <span id="statuschip" class="statuschip">idle</span>
        <button class="ghost" id="dlBtn" style="padding:5px 12px;font-size:12px;display:none">⬇ JSON</button>
      </div>
      <div class="tabbody">
        <pre class="console" id="console" data-tab="console"><span class="muted">// live output appears here</span></pre>
        <div class="findings" id="findings" data-tab="findings" style="display:none"></div>
        <pre class="json" id="json" data-tab="json" style="display:none"></pre>
      </div>
    </div>

    <div class="jobs">
      <h3 id="jobsToggle">▸ SCAN HISTORY <span class="muted" id="jobsCount">(0)</span></h3>
      <div class="joblist" id="joblist" style="display:none"></div>
    </div>
  </main>
</div>
<script src="/static/app.js"></script>
</body>
</html>
